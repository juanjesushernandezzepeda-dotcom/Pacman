<ion-content [fullscreen]="true" class="recuperar-page">

  <div class="game-screen">

    <video
      class="video-fondo"
      autoplay
      muted
      loop
      playsinline>

      <source
        src="assets/videos/iniciopacman.mp4"
        type="video/mp4">

    </video>

    <div class="dark-overlay" ></div>


    <div class="recuperar-container">

      <div class="logo-area">

        <div class="mini-pacman"></div>

        <h1>PAC-MAN</h1>

        <h2>RECUPERAR CUENTA</h2>

        <p>
          RECUPERA EL ACCESO AL LABERINTO
        </p>

      </div>


      <!-- PASO 1 -->
      <div class="section-title">

        <span class="step-number">
          1
        </span>

        <div>

          <h3>
            VERIFICAR CORREO
          </h3>

          <p>
            Te enviaremos un código de verificación
          </p>

        </div>

      </div>


      <div class="field-group">

        <label>CORREO ELECTRÓNICO</label>

        <div class="input-container">

          <ion-icon
            name="mail-outline">
          </ion-icon>

          <ion-input
            type="email"
            name="correo"
            inputmode="email"
            maxlength="100"
            placeholder="jugador@correo.com"
            [(ngModel)]="correo">
          </ion-input>

        </div>

      </div>


      <ion-button
        type="button"
        expand="block"
        class="main-button"
        (click)="enviarCodigo()">

        ENVIAR CÓDIGO

      </ion-button>


      <div class="divider">

        <span></span>

        <p>VERIFICACIÓN</p>

        <span></span>

      </div>


      <!-- PASO 2 -->
      <div class="section-title">

        <span class="step-number">
          2
        </span>

        <div>

          <h3>
            CAMBIAR CONTRASEÑA
          </h3>

          <p>
            Introduce el código recibido
          </p>

        </div>

      </div>


      <!-- CÓDIGO -->
      <div class="field-group">

        <label>
          CÓDIGO DE VERIFICACIÓN
        </label>

        <div class="input-container">

          <ion-icon
            name="keypad-outline">
          </ion-icon>

          <ion-input
            type="tel"
            inputmode="numeric"
            name="codigo"
            minlength="6"
            maxlength="6"
            placeholder="000000"
            [(ngModel)]="codigo"
            (keydown)="permitirSoloNumeros($event)"
            (ionInput)="soloNumerosCodigo($event)">
          </ion-input>

        </div>

      </div>


      <!-- NUEVA CONTRASEÑA -->
      <div class="field-group">

        <label>
          NUEVA CONTRASEÑA
        </label>

        <div class="input-container">

          <ion-icon
            name="lock-closed-outline">
          </ion-icon>

          <ion-input
            [type]="mostrarContrasena ? 'text' : 'password'"
            name="nuevaContrasena"
            minlength="8"
            maxlength="20"
            placeholder="********"
            [(ngModel)]="nuevaContrasena"
            (ionInput)="quitarEspaciosNuevaContrasena($event)">
          </ion-input>

          <ion-button
            type="button"
            fill="clear"
            class="eye-button"
            (click)="cambiarVisibilidad()">

            <ion-icon
              [name]="mostrarContrasena
                ? 'eye-off-outline'
                : 'eye-outline'">
            </ion-icon>

          </ion-button>

        </div>

      </div>


      <!-- CONFIRMAR -->
      <div class="field-group">

        <label>
          CONFIRMAR CONTRASEÑA
        </label>

        <div class="input-container">

          <ion-icon
            name="shield-checkmark-outline">
          </ion-icon>

          <ion-input
            [type]="mostrarContrasena ? 'text' : 'password'"
            name="confirmarContrasena"
            minlength="8"
            maxlength="20"
            placeholder="********"
            [(ngModel)]="confirmarContrasena"
            (ionInput)="quitarEspaciosConfirmacion($event)">
          </ion-input>

        </div>

      </div>


      <ion-button
        type="button"
        expand="block"
        class="main-button"
        (click)="cambiarContrasena()">

        CAMBIAR CONTRASEÑA

      </ion-button>


      <ion-button
        type="button"
        expand="block"
        fill="outline"
        class="secondary-button"
        routerLink="/login">

        VOLVER AL INICIO

      </ion-button>

    </div>

  </div>

</ion-content>
